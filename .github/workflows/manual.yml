name: FP_TOM

on:
  workflow_dispatch:

env:
  PASS: ${{ secrets.PASS }}

jobs:
  hello-world:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup
        run: |
          mkdir -p work-dir
          wget -O fp-bot.7z "https://www.dropbox.com/scl/fi/ug1l794zxe4ixfrfkl39v/fp-bot-ackermann.7z?rlkey=r45umk3uh5b29qz1nvpmfbj96&st=qqe0mu46&dl=0
          "
          7z x fp-bot.7z -p"$PASS" -o./work-dir
          cd work-dir/fp-bot && npm install

      - name: Start Job
        working-directory: work-dir/fp-bot
        run: |
          echo "CRED 1 - N7"
          FP_CREDENTIALS=$(realpath credentials.json) node scripts/earn-zombie-hats.js
          FP_CREDENTIALS=$(realpath credentials.json) node scripts/earn-skeleton-hats.js
          echo "CRED 2 - FU"
          FP_CREDENTIALS=$(realpath alts/alt1.json) node scripts/earn-zombie-hats.js
          FP_CREDENTIALS=$(realpath alts/alt1.json) node scripts/earn-skeleton-hats.js
          echo "CRED 3 - SU"
          FP_CREDENTIALS=$(realpath alts/alt2.json) node scripts/earn-zombie-hats.js
          FP_CREDENTIALS=$(realpath alts/alt2.json) node scripts/earn-skeleton-hats.js
          echo "CRED 4 - SN"
          FP_CREDENTIALS=$(realpath alts/alt3.json) node scripts/earn-zombie-hats.js
          FP_CREDENTIALS=$(realpath alts/alt3.json) node scripts/earn-skeleton-hats.js
          echo "CRED 5 - N8"
          FP_CREDENTIALS=$(realpath alts/alt4.json) node scripts/earn-zombie-hats.js
          FP_CREDENTIALS=$(realpath alts/alt4.json) node scripts/earn-skeleton-hats.js
