name: Warp Proxy with Tailscale

on:
  workflow_dispatch:

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget

      - name: Configure WARP
        run: |
          curl -L -o warp-newip.sh https://gist.githubusercontent.com/izaart95-jpg/98f06635237c8044e37f722d22220cfd/raw/dbd7085cf3c6968601a2e53c60842c010b33efe6/warp-newip.sh 
          chmod +x warp-newip.sh
          nohup ./warp-newip.sh serve > warp.log 2>&1 &
          sleep 15
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep warp || echo "WARP check failed"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=gh-proxy-${{ github.run_id }}
          ping: 8.8.8.8

      - name: Show Tailscale status
        run: |
          tailscale status || true
          echo "Proxy available on tailnet at: $(tailscale ip -4):8000"

      - name: Keep alive
        run: |
          sleep 108000
